services:
  - type: web
    name: autonomous-ai-engineer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run engineer_app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: MODEL_NAME
        value: openai/gpt-oss-120b
